name: Run ML-02 Research Question

on:
  push:
    branches: [main]
    paths-ignore:
      - 'work/notebooks/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-ml02:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout submission repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone official FlyRank starter
        run: git clone --depth 1 https://github.com/flyrank-bih/flyrank-ml-internship-starter.git /tmp/flyrank-starter

      - name: Ensure starter CSV is available
        run: |
          mkdir -p /tmp/flyrank-starter/data/raw
          curl -L --fail --retry 3 https://raw.githubusercontent.com/flyrank-bih/flyrank-ml-internship-starter/main/data/raw/content_refresh_anonymized.csv -o /tmp/flyrank-starter/data/raw/content_refresh_anonymized.csv

      - name: Install notebook dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r /tmp/flyrank-starter/requirements.txt nbformat nbclient jupyter

      - name: Copy ML-02 notebook into starter workspace
        run: |
          mkdir -p /tmp/flyrank-starter/work/notebooks
          cp work/notebooks/w01_research_question.ipynb /tmp/flyrank-starter/work/notebooks/w01_research_question.ipynb

      - name: Execute ML-02 notebook top to bottom
        working-directory: /tmp/flyrank-starter
        run: |
          jupyter nbconvert --to notebook --execute --inplace work/notebooks/w01_research_question.ipynb --ExecutePreprocessor.timeout=900

      - name: Copy executed notebook back
        run: cp /tmp/flyrank-starter/work/notebooks/w01_research_question.ipynb work/notebooks/w01_research_question.ipynb

      - name: Commit executed notebook
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/notebooks/w01_research_question.ipynb
          if git diff --cached --quiet; then
            echo 'No notebook changes to commit.'
          else
            git commit -m 'Execute ML-02 research question notebook'
            git push
          fi
